version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rag-service:
    build: .
    container_name: rag-service
    restart: always
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

volumes:
  qdrant_data:
